<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Alunos</title>
</head>
<body>

    <h2>Alunos Cadastrados</h2>

    <table border="1">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Curso</th>
                <th>Turma</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for aluno in alunos %}
            <tr>
                <td>{{ aluno.nome }}</td>
                <td>{{ aluno.curso }}</td>
                <td>{{ aluno.turma }}</td>
                <td>
                    <button>Edição</button>
                    <button>Excluir</button>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
